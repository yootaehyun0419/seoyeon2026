<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>서연초 협의 취합</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 학교 결재판 — 왼쪽에 부서·학년 목록, 오른쪽에 작성/취합/종합 패널. 완료는 붉은 인주 도장으로 표시 */
:root{
  --paper:#f3f5f8; --surface:#ffffff; --ink:#1c2633; --muted:#5b6878; --line:#d8dee6;
  --accent:#23468f; --accent-soft:#e6ecf8; --seal:#c3302a; --seal-soft:#fbe9e7;
  --ok:#2c7a4c; --warn:#a86c12; --warn-soft:#fbf1df;
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11151b; --surface:#19202a; --ink:#e5eaf0; --muted:#97a3b2; --line:#2b3542;
  --accent:#93b1ff; --accent-soft:#1f2b45; --seal:#ff6a5e; --seal-soft:#3a1e1d;
  --ok:#6dcb93; --warn:#e2ad4c; --warn-soft:#352a17; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151b; --surface:#19202a; --ink:#e5eaf0; --muted:#97a3b2; --line:#2b3542;
  --accent:#93b1ff; --accent-soft:#1f2b45; --seal:#ff6a5e; --seal-soft:#3a1e1d;
  --ok:#6dcb93; --warn:#e2ad4c; --warn-soft:#352a17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:1.65rem;letter-spacing:-.01em}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;font-weight:500}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.unit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button.seal{background:var(--seal);border-color:var(--seal);color:#fff}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
button.ghost:hover{color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:140px;resize:vertical;line-height:1.65}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500}
label > *{color:var(--ink)}

header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border-radius:999px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.roundbar{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.roundrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.roundrow select{width:auto;min-width:180px;font-weight:600}
.agenda{white-space:pre-wrap;font-size:.95rem}
.due{font-size:.85rem;color:var(--warn);font-weight:600}
.roundform{display:grid;grid-template-columns:1fr 180px;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.roundform .full{grid-column:1/-1}
.roundform textarea{min-height:70px}
.adminform{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;border-top:1px dashed var(--line);padding-top:12px}
.adminform label{flex:1;min-width:200px}

.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
nav.units{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.ugroup{display:flex;flex-direction:column;gap:4px}
.unit{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border-radius:8px;padding:7px 10px;border:1px solid transparent;background:transparent}
.unit:hover{background:var(--surface);border-color:var(--line)}
.unit[aria-current="true"]{background:var(--surface);border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.unit .n{font-weight:600}
.unit .s{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.unit .s.done{color:var(--seal);font-weight:700}

main.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.phead .who{font-size:.9rem;color:var(--muted)}
.notice{border-radius:8px;padding:10px 12px;font-size:.9rem;background:var(--accent-soft)}
.notice.warn{background:var(--warn-soft)}
.notice.lock{background:var(--seal-soft)}
.form{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}

.posts{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.post{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.post .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.post .nm{font-weight:600}
.post .tk{font-size:.8rem;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 6px}
.post .tm{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.post .ct{white-space:pre-wrap;overflow-wrap:anywhere}
.post .ops{margin-left:auto;display:flex;gap:2px}
.secs{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.sec .sl{font-size:.8rem;font-weight:600;color:var(--accent)}
.secform{display:flex;flex-direction:column;gap:10px}
.seclabel{color:var(--accent);font-weight:600;font-size:.88rem}
.seclabel textarea{min-height:100px;font-weight:400;font-size:.95rem}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}

.missing{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted)}

.stamp{display:inline-grid;place-items:center;width:78px;height:78px;border:3px solid var(--seal);border-radius:50%;color:var(--seal);
  font-family:var(--display);font-size:1.25rem;transform:rotate(-12deg);line-height:1.1;text-align:center;flex:none}
.stamp small{display:block;font-family:var(--body);font-size:.58rem;font-weight:600;letter-spacing:.02em}
.stamp.sm{width:44px;height:44px;font-size:.8rem;border-width:2px}

.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.board.dept{grid-template-columns:repeat(9,minmax(0,1fr))}
.cell{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:104px;background:var(--surface);text-align:left;position:relative}
.cell .n{font-weight:600;padding-right:4px;overflow-wrap:anywhere}
.cell .h{font-size:.76rem;color:var(--muted)}
.pill{align-self:flex-start;font-size:.72rem;font-weight:600;border-radius:999px;padding:1px 8px;margin-top:auto}
.pill.wait{background:var(--paper);color:var(--muted)}
.pill.coll{background:var(--accent-soft);color:var(--accent)}
.pill.draft{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--seal-soft);color:var(--seal)}
.cell .stamp{position:absolute;right:8px;bottom:8px}
.sumline{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.sumline b{font-family:var(--display);font-size:1.4rem;margin-right:4px}
.doc{display:flex;flex-direction:column;gap:0}
.doc article{padding:16px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.doc article .t{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.doc .body{white-space:pre-wrap;overflow-wrap:anywhere;max-width:72ch}
details summary{cursor:pointer;color:var(--accent);font-size:.88rem}
details .posts{margin-top:8px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}

@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.units{position:static;flex-direction:row;flex-wrap:wrap;gap:10px}
  .ugroup{flex-direction:row;flex-wrap:wrap;gap:4px}
  .ugroup .eyebrow{width:100%}
  .unit{border-color:var(--line);background:var(--surface)}
  .board,.board.dept{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:520px){
  .grid2,.roundform{grid-template-columns:1fr}
  .board,.board.dept{grid-template-columns:repeat(2,minmax(0,1fr))}
  main.panel{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>[hidden]{display:none!important} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0}</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">2026학년도 서연초등학교</div>
      <h1>부서·학년 협의 취합</h1>
    </div>
    <div class="tabs" role="tablist" aria-label="화면 선택">
      <button id="tab-write" data-mode="write" aria-pressed="true">답변 작성</button>
      <button id="tab-head" data-mode="head" aria-pressed="false">부장 취합</button>
      <button id="tab-board" data-mode="board" aria-pressed="false">종합 현황</button>

      <span class="due" id="roundDue"></span>
      <span style="flex:1"></span>
      <button id="btnDelRound" class="ghost" hidden>회차 삭제</button>
      <button id="btnEditRound" class="ghost" hidden>회차 수정</button>
      <button id="btnNewRound" hidden>새 회차 열기</button>
      <button id="btnAdmin" class="ghost">관리자</button>
    </div>
    <div class="agenda" id="roundDesc"></div>
    <form class="adminform" id="adminForm" hidden>

      <div class="actions"><button type="button" id="adCancel" class="ghost">취소</button><button type="submit" class="primary" id="adOk">확인</button></div>
    </form>
    <form class="roundform" id="roundForm" hidden>
      <label>회차 이름<input id="rfTitle" required maxlength="60" placeholder="예: 11월 교육과정 평가회 협의"></label>
      <label>마감일<input id="rfDue" type="date"></label>
      <label class="full">협의 안건·안내<textarea id="rfDesc" placeholder="예: 2027학년도 교육과정 편성을 위한 부서별·학년별 의견을 올려 주세요.&#10;1. 올해 운영 성과  2. 개선할 점  3. 내년 요청 사항"></textarea></label>
      <div class="actions full"><button type="button" id="rfCancel" class="ghost">취소</button><button type="submit" class="primary" id="rfSave">저장</button></div>
    </form>
  </section>

  <div class="layout" id="layout">
    <nav class="units" id="units" aria-label="부서와 학년"></nav>
    <main class="panel" id="panel">
      <div class="empty">협의 자료를 불러오는 중입니다.</div>
    </main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};

const hasSecs=x=>!!x&&SECS.some(([k])=>typeof x[k]==="string"&&x[k]!=="");
const secVals=x=> !x? ["","",""] : (hasSecs(x)||!x.content)? SECS.map(([k])=>String(x[k]??"")) : [x.content,"",""];
const composeText=x=>SECS.map(([k,l],i)=>`${i+1}. ${l}\n${(x[k]||"").trim()||"-"}`).join("\n\n");
const textOf=x=>{ const v=secVals(x); return composeText({s1:v[0],s2:v[1],s3:v[2]}); };
function secsHTML(x){ const v=secVals(x);
  return `<div class="secs">${SECS.map(([k,l],i)=>`<div class="sec"><div class="sl">${i+1}. ${l}</div><div class="ct">${v[i].trim()?esc(v[i]):'<span class="muted">-</span>'}</div></div>`).join("")}</div>`; }

/* ---------- 서버 통신 ---------- */
const configured=/^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL);
const clientKey=(()=>{ let k=ls.get("hy.key"); if(!k){ k=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2)); ls.set("hy.key",k);} return k; })();
const ERR={forbidden:"권한이 없습니다.",locked:"이미 완료 제출되어 답변을 고칠 수 없습니다.",not_found:"자료를 찾지 못했습니다. 새로고침해 주세요.",bad_request:"입력값을 확인해 주세요.",busy:"사용자가 많습니다. 잠시 후 다시 눌러 주세요."};
async function apiGet(params){
  const u=new URL(API_URL); Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u.toString()); const j=await r.json(); if(!j.ok) throw new Error(j.error||"error"); return j;
}
async function apiPost(body){
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,key:clientKey,admin:S.admin})});
  const j=await r.json(); if(!j.ok) throw new Error(j.error||"error"); return j;
}
function fail(e){ const c=e&&e.message; toast(ERR[c]||"저장하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요."); }
async function run(fn){ S.busy=true; try{ await fn(); await load(true,true); } catch(e){ fail(e); } finally{ S.busy=false; } }

async function load(quiet,force){
  if(!configured){ S.loaded=true; renderRounds(); mountMain(); return; }
  try{
    const j=await apiGet({action:"load",key:clientKey});
    const sig=JSON.stringify([j.rounds,j.posts,j.summaries]);
    const changed = force || sig!==S.sig; S.sig=sig; S.online=true;
    S.rounds=(j.rounds||[]).map(r=>({...r,due:normDate(r.due)})).sort((a,b)=>(Number(b.createdAt)||0)-(Number(a.createdAt)||0));
    S.allPosts=j.posts||[]; S.allSums=j.summaries||[];
    if(!S.rounds.find(r=>r.id===S.roundId)){ const saved=ls.get("hy.round"); S.roundId=S.rounds.find(r=>r.id===saved)?saved:(S.rounds[0]?.id||null); S.sumDirty=false; S.editingId=null; if(S.loaded) force=true; }
    applyRound();
    if(!S.loaded){ S.loaded=true; renderRounds(); renderUnits(); mountMain(); }
    else if(changed||force){ renderRounds(); renderUnits(); force&&!S.roundId? mountMain() : refreshMain(); }
  }catch(e){
    const wasOnline=S.online; S.online=false;
    if(!S.loaded){ S.loaded=true; renderRounds(); renderUnits(); mountMain(); }
    else if(wasOnline && !quiet) toast("서버에 연결하지 못했습니다.");
  }
}
function normDate(v){ if(!v) return ""; const s=String(v); if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10); const d=new Date(s); return isNaN(d)?"":`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function applyRound(){
  S.posts=S.allPosts.filter(p=>p.roundId===S.roundId);
  const m={}; S.allSums.filter(s=>s.roundId===S.roundId).forEach(s=>m[s.unit]=s); S.sums=m;
}

const unitPosts=k=>S.posts.filter(p=>p.unit===k).sort((a,b)=>(Number(a.createdAt)||0)-(Number(b.createdAt)||0));
const sumOf=k=>S.sums[k]||null;
function statusOf(k){ const s=sumOf(k); if(s&&s.status==="done") return "done"; if(s&&secVals(s).some(x=>x.trim())) return "draft"; return unitPosts(k).length?"coll":"wait"; }
const curRound=()=>S.rounds.find(r=>r.id===S.roundId)||null;

function permNote(){

  if(!S.online) return `<div class="notice warn">저장소에 연결하지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.</div>`;
  return "";
}
const readOnly=()=>!configured||!S.online;
function mountMain(){
  const P=$("panel");
  if(!S.loaded) return;
  if(!S.roundId){ P.dataset.ctx=""; P.innerHTML=`${permNote()}<div class="empty">${S.online?(S.isAdmin?"위의 <b>새 회차 열기</b>로 협의 안건을 등록하면 시작할 수 있습니다.":"교육과정부에서 협의 회차를 열면 이곳에 답변을 올릴 수 있습니다."):"저장소에 연결되면 협의 회차와 답변이 이곳에 표시됩니다."}</div>`; return; }

  if(S.mode==="write") mountWrite(P); else if(S.mode==="head") mountHead(P); else mountBoard(P);

function postHTML(p,editable,extra=""){
  const canEdit = editable && p.mine, canDel = editable && (p.mine || S.isAdmin);
  const edited = p.updatedAt && String(p.updatedAt)!==String(p.createdAt);
  return `<div class="post" data-id="${esc(p.id)}"><div class="meta"><span class="nm">${esc(p.name)}</span>${p.task?`<span class="tk">${esc(p.task)}</span>`:""}<span class="tm">${fmt(p.updatedAt||p.createdAt)}${edited?" 수정":""}</span>
    <span class="ops">${extra}${canEdit?`<button class="ghost" data-op="edit">수정</button>`:""}${canDel?`<button class="ghost" data-op="del">삭제</button>`:""}</span></div>
    ${secsHTML(p)}</div>`;
}
function submitPost(e){
  e.preventDefault(); const u=U[S.unit]; const v=$("wName").value;
  const name = v==="other"? $("wOther").value.trim() : (v!==""? u.roster[+v][0] : "");
  const task=$("wTask").value.trim();
  const sec={s1:$("ws1").value.trim(),s2:$("ws2").value.trim(),s3:$("ws3").value.trim()};
  if(!name){toast("작성자 이름을 골라 주세요.");return;}
  if(!sec.s1&&!sec.s2&&!sec.s3){toast("협의 내용을 한 항목 이상 적어 주세요.");return;}
  $("wSubmit").disabled=true;
  const editing=S.editingId;
  run(async()=>{
    await apiPost(editing? {action:"updatePost",id:editing,name,task,...sec} : {action:"addPost",roundId:S.roundId,unit:S.unit,name,task,...sec});
    toast(editing?"답변을 고쳤습니다.":"답변을 제출했습니다.");
    S.editingId=null; setW(["","",""]); $("wEditing").textContent=""; $("wCancel").hidden=true; $("wSubmit").textContent="제출";
  }).finally(()=>{ if($("wSubmit")) $("wSubmit").disabled = statusOf(S.unit)==="done"||readOnly(); });
}
function postOps(e){
  const b=e.target.closest("[data-op]"); if(!b) return; const id=b.closest(".post").dataset.id; const p=S.posts.find(x=>x.id===id); if(!p) return;
  if(b.dataset.op==="edit"){
    S.editingId=id; setW(secVals(p)); $("wTask").value=p.task||"";
    $("wEditing").textContent=`${p.name} 님의 답변을 고치는 중`; $("wCancel").hidden=false; $("wSubmit").textContent="수정 저장"; $("ws1").focus();
  } else if(b.dataset.op==="del"){
    if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="삭제 확인"; b.style.color="var(--seal)"; setTimeout(()=>{if(b.isConnected){b.dataset.armed="";b.textContent="삭제";b.style.color="";}},3000); return; }
    run(async()=>{ await apiPost({action:"deletePost",id}); toast("답변을 삭제했습니다."); });
  }
}

/* 부장 취합 */
function mountHead(P){
  const u=U[S.unit];
  P.innerHTML=`
    <div class="phead"><div><div class="eyebrow">${u.kind==="dept"?"업무(기능)부장":"학년부장"} 취합</div><h2>${u.name}</h2>
      <div class="who" style="margin-top:2px">취합 담당 ${esc(headTitle(u))}</div></div><div id="hStamp"></div></div>
    ${permNote()}
    <div id="hStatus"></div>
    <div><h3 style="margin-bottom:6px">답변 <span class="muted" id="hCount"></span></h3>
      <div class="missing" id="hMissing"></div>
      <div class="posts" id="hPosts" style="margin-top:8px"></div></div>
    <div class="form">
      <div class="phead" style="align-items:center"><h3>${u.name} 협의 결과</h3><button id="hFill" type="button">답변 전체 불러오기</button></div>
      <p class="muted" style="margin:0;font-size:.85rem">‘답변 전체 불러오기’를 누르면 선생님들의 답변이 항목별로 모입니다. 초안을 다듬어 저장하세요.</p>
      ${SECS.map(([k,l],i)=>`<label class="seclabel">${i+1}. ${l}<textarea id="h${k}" style="min-height:150px"></textarea></label>`).join("")}
      <div class="actions"><span class="muted" id="hSaved" style="margin-right:auto;font-size:.85rem"></span>
        <button type="button" id="hReopen" hidden>완료 취소</button>
        <button type="button" id="hDraft">임시 저장</button>
        <button type="button" class="seal" id="hDone">완료 제출</button></div>
    </div>`;
  const dirty=()=>{S.sumDirty=true; $("hSaved").textContent="저장 안 된 변경 있음";};
  SECS.forEach(([k])=>$("h"+k).addEventListener("input",dirty));
  const appendPosts=list=>SECS.forEach(([k],i)=>{
    const t=list.map(p=>{const v=secVals(p)[i].trim(); return v?`■ ${p.name}${p.task?` (${p.task})`:""}\n${v}`:"";}).filter(Boolean).join("\n\n");
    if(!t) return; const el=$("h"+k), cur=el.value.trim(); el.value = cur? cur+"\n\n"+t : t; });
  $("hFill").onclick=()=>{ const list=unitPosts(S.unit); if(!list.length){toast("불러올 답변이 없습니다.");return;} appendPosts(list); dirty(); };
  $("hPosts").addEventListener("click",e=>{const b=e.target.closest("[data-op='add']"); if(!b) return; const p=S.posts.find(x=>x.id===b.closest(".post").dataset.id); if(!p) return;
    appendPosts([p]); dirty(); toast(`${p.name} 님 답변을 항목별로 넣었습니다.`);});
  $("hDraft").onclick=()=>saveSum("draft");
  $("hDone").onclick=e=>{ const b=e.currentTarget; if(!SECS.some(([k])=>$("h"+k).value.trim())){toast("협의 결과를 먼저 작성해 주세요.");return;}
    if(b.dataset.armed!=="1"){b.dataset.armed="1"; b.textContent="정말 완료 제출"; setTimeout(()=>{if(b.isConnected){b.dataset.armed="";b.textContent="완료 제출";}},3500); return;}
    b.dataset.armed=""; b.textContent="완료 제출"; saveSum("done"); };
  $("hReopen").onclick=()=>saveSum("draft",true);
  refreshHead();
}
function refreshHead(){
  if(!$("hPosts")) return;
  const u=U[S.unit], s=sumOf(S.unit), done=statusOf(S.unit)==="done", list=unitPosts(S.unit);
  $("hStamp").innerHTML = done?`<div class="stamp">완료<small>${fmt(s.submittedAt)}</small></div>`:"";
  $("hStatus").innerHTML = done?`<div class="notice lock">완료 제출되어 교육과정부로 전달되었습니다. 고치려면 ‘완료 취소’를 누르세요.</div>`:"";
  $("hCount").textContent=list.length?`${list.length}건`:"";
  const answered=new Set(list.map(p=>p.name)); const miss=u.roster.map(r=>r[0]).filter(n=>!answered.has(n));
  $("hMissing").innerHTML = miss.length? `<span class="muted" style="font-size:.8rem">아직 답변 없음</span>`+miss.map(n=>`<span class="chip">${esc(n)}</span>`).join("") : `<span class="chip" style="color:var(--ok);border-color:var(--ok)">명단 전원 답변 완료</span>`;
  $("hPosts").innerHTML = list.length? list.map(p=>postHTML(p,false, done?"":`<button class="ghost" data-op="add">결과에 넣기</button>`)).join("") : `<div class="empty">아직 올라온 답변이 없습니다.</div>`;
  if(!S.sumDirty){ const v=secVals(s); SECS.forEach(([k],i)=>$("h"+k).value=v[i]); $("hSaved").textContent = s&&s.updatedAt? `${fmt(s.updatedAt)} 저장됨`:""; }
  const ro=readOnly();
  SECS.forEach(([k])=>$("h"+k).readOnly = done || ro);
  $("hFill").disabled=done||ro; $("hDraft").disabled=done||ro; $("hDone").disabled=done||ro;
  $("hDraft").hidden=done; $("hDone").hidden=done; $("hReopen").hidden=!done; $("hReopen").disabled=ro;
}
function saveSum(status,reopen=false){
  const u=U[S.unit], prev=sumOf(S.unit);
  const v = reopen? secVals(prev) : SECS.map(([k])=>$("h"+k).value.trim());
  ["hDraft","hDone","hReopen"].forEach(id=>$(id)&&($(id).disabled=true));
  run(async()=>{
    await apiPost({action:"saveSummary",roundId:S.roundId,unit:S.unit,s1:v[0],s2:v[1],s3:v[2],status,head:u.head});
    S.sumDirty=false;
    toast(status==="done"?`${u.name} 협의 결과를 완료 제출했습니다.`: reopen?"완료를 취소했습니다. 다시 고칠 수 있습니다.":"임시 저장했습니다.");
  }).finally(()=>refreshHead());
}

/* 종합 현황 */
function compileText(){
  const r=curRound(); let out=`[${r?r.title:""}] 부서·학년 협의 결과\n`;
  UNITS.forEach(u=>{ const s=sumOf(u.key); out+=`\n━━ ${u.name} (${headTitle(u)}) — ${STATUS_LABEL[statusOf(u.key)]}\n`;
    out+= s&&s.status==="done"? textOf(s)+"\n" : "(완료 제출 전)\n"; });
  return out;
}
const csvCell=v=>`"${String(v??"").replace(/"/g,'""')}"`;
function mountBoard(P){
  const open=new Set([...P.querySelectorAll("details[open]")].map(d=>d.dataset.k));
  const counts={done:0,draft:0,coll:0,wait:0}; UNITS.forEach(u=>counts[statusOf(u.key)]++);
  const cell=u=>{const st=statusOf(u.key), n=unitPosts(u.key).length, names=new Set(unitPosts(u.key).map(p=>p.name)).size;
    return `<button class="cell" data-goto="${u.key}"><span class="n">${u.name}</span><span class="h">${esc(headTitle(u))}</span>
      <span class="h" style="font-variant-numeric:tabular-nums">답변 ${n}건 · ${names}/${u.roster.length}명</span>
      ${st==="done"?`<span class="stamp sm">완료</span>`:`<span class="pill ${st}">${STATUS_LABEL[st]}</span>`}</button>`;};
  const art=u=>{const s=sumOf(u.key), st=statusOf(u.key), list=unitPosts(u.key);
    return `<article><div class="t"><h3>${u.name}</h3><span class="muted" style="font-size:.85rem">${esc(headTitle(u))}</span>
      <span class="pill ${st}" style="margin:0">${STATUS_LABEL[st]}${st==="done"?" · "+fmt(s.submittedAt):""}</span></div>
      ${st==="done"?`<div class="body">${secsHTML(s)}</div>`:`<div class="muted" style="font-size:.9rem">부장 완료 제출 전입니다.${st==="draft"?" (취합 초안 작성 중)":""}</div>`}
      ${list.length?`<details data-k="${u.key}"${open.has(u.key)?" open":""}><summary>원답변 ${list.length}건 보기</summary><div class="posts">${list.map(p=>postHTML(p,false)).join("")}</div></details>`:""}</article>`;};
  P.innerHTML=`
    <div class="phead"><div><div class="eyebrow">교육과정부 종합</div><h2>${esc(curRound()?.title||"")} 취합 현황</h2></div>
      <div class="actions"><button id="bCopy">완료분 전체 복사</button><button id="bCsv">CSV 내려받기</button></div></div>
    ${permNote()}
    <div class="sumline"><span><b style="color:var(--seal)">${counts.done}</b>/${UNITS.length} 완료</span><span><b>${counts.draft}</b>취합 중</span><span><b>${counts.coll}</b>답변 수집 중</span><span class="muted"><b>${counts.wait}</b>대기</span></div>
    <div><div class="eyebrow" style="margin-bottom:6px">업무(기능) 부서</div><div class="board dept">${UNITS.filter(u=>u.kind==="dept").map(cell).join("")}</div></div>
    <div><div class="eyebrow" style="margin-bottom:6px">학년</div><div class="board">${UNITS.filter(u=>u.kind==="grade").map(cell).join("")}</div></div>
    <div class="doc">${UNITS.map(art).join("")}</div>`;
  P.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{ S.unit=b.dataset.goto; ls.set("hy.unit",S.unit); $("tab-head").click(); });
  $("bCopy").onclick=async()=>{ const t=compileText(); try{await navigator.clipboard.writeText(t); toast("복사했습니다. 한글·워드에 붙여 넣으세요.");}
    catch(e){ const ta=document.createElement("textarea"); ta.value=t; ta.style.minHeight="200px"; P.appendChild(ta); ta.select(); toast("자동 복사가 막혀 아래에 텍스트를 펼쳤습니다. Ctrl+C로 복사하세요."); } };
  $("bCsv").onclick=()=>{
    const L=SECS.map(([,l],i)=>`${i+1}. ${l}`);
    const rows=[["구분","부서/학년","취합 부장","상태","완료 제출 시각",...L.map(x=>"[결과] "+x),"작성자","담당 업무",...L.map(x=>"[답변] "+x),"답변 시각"]];
    UNITS.forEach(u=>{ const s=sumOf(u.key), st=STATUS_LABEL[statusOf(u.key)], list=unitPosts(u.key), isDone=s&&s.status==="done";
      const base=[u.kind==="dept"?"부서":"학년",u.name,u.head,st,isDone?new Date(Number(s.submittedAt)).toLocaleString("ko-KR"):"",...(isDone?secVals(s):["","",""])];
      const blank=[base[0],base[1],"","","","","",""];
      if(!list.length) rows.push([...base,"","","","","",""]);
      list.forEach((p,i)=>rows.push([...(i===0?base:blank),p.name,p.task||"",...secVals(p),new Date(Number(p.createdAt)).toLocaleString("ko-KR")])); });
    const csv="﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
    a.download=`협의취합_${(curRound()?.title||"회차").replace(/[\\/:*?"<>|]/g,"")}.csv`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast("CSV 파일을 내려받았습니다.");
  };
}

/* ---------- 시작 ---------- */
(function boot(){
  S.mode=["write","head","board"].includes(ls.get("hy.mode"))? ls.get("hy.mode") : "write";
  S.unit=U[ls.get("hy.unit")]? ls.get("hy.unit") : "gyomu";
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.mode===S.mode));
  const pw=ls.get("hy.admin");
  renderUnits();
  if(pw&&configured){ S.admin=pw; apiPost({action:"checkAdmin"}).then(()=>{S.isAdmin=true; renderAdmin(); refreshMain();}).catch(()=>{S.admin=""; ls.del("hy.admin");}); }
  load();
  setInterval(()=>{ if(document.visibilityState==="visible"&&!S.busy) load(true); },30000);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&!S.busy) load(true); });
})();
</script>
</body>
</html>
