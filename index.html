 {key:"g3",name:"3학년",kind:"grade",head:"황승진",roster:[["황승진","3-1 담임"],["김춘섭","3-2 담임"],["김재현","3-3 담임"],["신수진","3-4 담임"],["김예솔","3-5 담임"],["안수연","3-6 담임"],["정국희","3-7 담임"],["박솔빈","3-8 담임"],["편세훈","3학년 과학 전담"],["윤선주","3학년 영어 전담"]]},
 {key:"g4",name:"4학년",kind:"grade",head:"정지아",roster:[["정지아","4-1 담임"],["정진아","4-2 담임"],["박향애","4-3 담임"],["홍승조","4-4 담임"],["전보배","4-5 담임"],["윤 정","4-6 담임"],["김은경","4-7 담임"],["정선형","4-8 담임"],["오안나","4-9 담임"],["박진희","4-10 담임"],["전꽃님","4학년 영어 전담"],["정옥희","4학년 과학 전담"]]},
 {key:"g5",name:"5학년",kind:"grade",head:"박흥제",roster:[["박흥제","5-1 담임"],["하명희","5-2 담임"],["백은미","5-3 담임"],["박정민","5-4 담임"],["김민경","5-5 담임"],["이영민","5-6 담임"],["소민섭","5-7 담임"],["안정현","5-8 담임"],["나현미","5-9 담임"],["유선형","5-10 담임"],["김지현","5학년 과학 전담"],["박송이","5학년 영어 전담"],["조원정","5학년 체육 전담"]]},
 {key:"g6",name:"6학년",kind:"grade",head:"김유진",roster:[["김유진","6-1 담임"],["임서정","6-2 담임"],["유태현","6-3 담임"],["허다영","6-4 담임"],["박은지","6-5 담임"],["이정우","6-6 담임"],["이새봄","6-7 담임"],["강수지","6-8 담임"],["김경집","6-9 담임"],["김소연","6학년 과학 전담"],["신윤희","6학년 영어 전담"],["최광환","6학년 체육 전담"]]},
];
const U = Object.fromEntries(UNITS.map(u=>[u.key,u]));
const headTitle = u => u.headLabel || (u.kind==="dept" ? `${u.head} 부장` : `${u.head} 학년부장`);

const S = {db:null,user:null,uid:null,canWrite:null,isAdmin:false,
  rounds:[],roundId:null,posts:[],sums:{},unit:"gyomu",mode:"write",
  editingId:null,sumDirty:false,unsub:[],loaded:false};

const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = t => { if(!t) return ""; const d=new Date(t); const p=n=>String(n).padStart(2,"0"); return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const ls = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
let toastT; function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
function fail(e){ const c=e&&e.code; if(c==="invalid_argument"&&S.canWrite!==true){S.canWrite=false;mountMain();toast("작성 권한이 없어 저장하지 못했습니다.");return;}
  toast(c==="quota_exceeded"?"저장 공간이 가득 찼습니다. 관리자에게 알려 주세요.":"저장하지 못했습니다. 잠시 후 다시 눌러 주세요."); }

const unitPosts = k => S.posts.filter(p=>p.unit===k).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
const sumOf = k => S.sums[k] || null;
function statusOf(k){ const s=sumOf(k); if(s&&s.status==="done") return "done"; if(s&&s.content) return "draft"; return unitPosts(k).length?"coll":"wait"; }
const SECS=[["s1","2026 운영 성과","올해 운영하며 거둔 성과, 잘된 점"],["s2","개선점 및 재구상 방향","보완할 점과 2027학년도 운영 방향"],["s3","기타 및 건의사항","그 밖의 의견, 학교에 건의할 내용"]];
const hasSecs=x=>!!x&&SECS.some(([k])=>typeof x[k]==="string");
const secVals=x=> !x? ["","",""] : hasSecs(x)? SECS.map(([k])=>x[k]||"") : [x.content||"","",""];
const composeText=x=>SECS.map(([k,l],i)=>`${i+1}. ${l}\n${(x[k]||"").trim()||"-"}`).join("\n\n");
const textOf=x=> hasSecs(x)? composeText(x) : (x&&x.content||"");
function secsHTML(x){ if(!hasSecs(x)) return `<div class="ct">${esc(x&&x.content||"")}</div>`;
  return `<div class="secs">${SECS.map(([k,l],i)=>`<div class="sec"><div class="sl">${i+1}. ${l}</div><div class="ct">${(x[k]||"").trim()?esc(x[k]):'<span class="muted">-</span>'}</div></div>`).join("")}</div>`; }
function setW(v){ SECS.forEach(([k],i)=>{ const el=$("w"+k); if(el) el.value=v[i]||""; }); }
const STATUS_LABEL={done:"완료",draft:"취합 중",coll:"답변 수집 중",wait:"대기"};
const curRound = () => S.rounds.find(r=>r.id===S.roundId)||null;

/* ---------- rounds ---------- */
function renderRounds(){
  const sel=$("roundSel");
  if(!S.rounds.length){ sel.innerHTML=`<option>열린 회차 없음</option>`; sel.disabled=true; }
  else{ sel.disabled=false; sel.innerHTML=S.rounds.map(r=>`<option value="${esc(r.id)}"${r.id===S.roundId?" selected":""}>${esc(r.title)}</option>`).join(""); }
  const r=curRound();
  $("roundDue").textContent = r&&r.due ? `마감 ${r.due.slice(5).replace("-","/")}` : "";
  $("roundDesc").textContent = r ? (r.desc||"") : (S.isAdmin?"새 회차를 열면 선생님들이 답변을 올릴 수 있습니다.":"아직 열린 협의 회차가 없습니다.");
  $("roundDesc").hidden = !$("roundDesc").textContent;
  $("btnNewRound").hidden=!S.isAdmin; $("btnEditRound").hidden=!(S.isAdmin&&r);
}
let roundEditMode=null;
function openRoundForm(mode){
  roundEditMode=mode; const r=curRound(); $("roundForm").hidden=false;
  $("rfTitle").value= mode==="edit"&&r? r.title:""; $("rfDue").value= mode==="edit"&&r? (r.due||""):""; $("rfDesc").value= mode==="edit"&&r? (r.desc||""):"";
  $("rfTitle").focus();
}
$("btnNewRound").onclick=()=>openRoundForm("new");
$("btnEditRound").onclick=()=>openRoundForm("edit");
$("rfCancel").onclick=()=>{$("roundForm").hidden=true;};
$("roundForm").addEventListener("submit",async e=>{
  e.preventDefault(); const title=$("rfTitle").value.trim(); if(!title) return;
  const body={title,due:$("rfDue").value,desc:$("rfDesc").value.trim()};
  $("rfSave").disabled=true;
  try{
    if(roundEditMode==="edit"&&S.roundId){ await S.db.doc("rounds/"+S.roundId).update(body); toast("회차 정보를 고쳤습니다."); }
    else { const id="r"+Date.now(); await S.db.doc("rounds/"+id).set({...body,createdAt:Date.now()}); selectRound(id); toast("새 회차를 열었습니다."); }
    $("roundForm").hidden=true;
  }catch(err){ toast(err&&err.code==="invalid_argument"?"회차는 편집자(Editor) 이상만 만들 수 있습니다.":"저장하지 못했습니다."); }
  $("rfSave").disabled=false;
});
$("roundSel").onchange=e=>selectRound(e.target.value);

function selectRound(id){
  if(S.roundId===id&&S.unsub.length) return;
  S.roundId=id; ls.set("hy.round",id); S.posts=[]; S.sums={}; S.sumDirty=false; S.editingId=null;
  S.unsub.forEach(f=>f()); S.unsub=[];
  renderRounds();
  if(!id){ renderUnits(); mountMain(); return; }
  S.unsub.push(S.db.collection("posts").where("roundId","==",id).onSnapshot(snap=>{
    S.posts=snap.docs.map(d=>({id:d.id,...d.data()})); renderUnits(); refreshMain();
  },()=>{}));
  S.unsub.push(S.db.collection("summaries").where("roundId","==",id).onSnapshot(snap=>{
    const m={}; snap.docs.forEach(d=>{const x=d.data(); m[x.unit]=x;}); S.sums=m; renderUnits(); refreshMain();
  },()=>{}));
  renderUnits(); mountMain();
}

/* ---------- unit nav ---------- */
function renderUnits(){
  const grp=(kind,label)=>`<div class="ugroup"><span class="eyebrow">${label}</span>${UNITS.filter(u=>u.kind===kind).map(u=>{
    const st=statusOf(u.key), n=unitPosts(u.key).length;
    const s= st==="done"?`<span class="s done">완료</span>`:`<span class="s">${n?n+"건":""}</span>`;
    return `<button class="unit" data-unit="${u.key}" aria-current="${S.mode!=="board"&&S.unit===u.key}"><span class="n">${u.name}</span>${s}</button>`;}).join("")}</div>`;
  $("units").innerHTML=grp("dept","업무(기능) 부서")+grp("grade","학년");
  $("units").hidden = S.mode==="board";
  $("layout").style.gridTemplateColumns = S.mode==="board" ? "minmax(0,1fr)" : "";
}
$("units").addEventListener("click",e=>{const b=e.target.closest("[data-unit]"); if(!b) return; selectUnit(b.dataset.unit);});
function selectUnit(k){ if(S.unit!==k){S.unit=k; ls.set("hy.unit",k); S.sumDirty=false; S.editingId=null;} renderUnits(); mountMain(); }

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  S.mode=b.dataset.mode; ls.set("hy.mode",S.mode);
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  S.sumDirty=false; renderUnits(); mountMain();
});

/* ---------- main panel ---------- */
function permNote(){
  if(S.canWrite===false) return `<div class="notice warn">이 화면은 보기 전용입니다. 글을 올리려면 공유 설정에서 '참여자(Contributor)' 이상 권한을 받아야 합니다.</div>`;
  if(!S.db) return `<div class="notice warn" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><span style="flex:1;min-width:200px" id="enableMsg">저장 기능이 꺼져 있습니다. 버튼을 눌러 저장 기능을 허용해 주세요.</span><button class="primary" type="button" data-enable-db>저장 기능 켜기</button></div>`;
  return "";
}
function mountMain(){
  const P=$("panel");
  if(!S.loaded){ return; }
  if(!S.roundId){ P.innerHTML=`${permNote()}<div class="empty">${S.isAdmin?"위의 <b>새 회차 열기</b>로 협의 안건을 등록하면 시작할 수 있습니다.":"교육과정부에서 협의 회차를 열면 이곳에 답변을 올릴 수 있습니다."}</div>`; return; }
  if(S.mode==="write") mountWrite(P); else if(S.mode==="head") mountHead(P); else mountBoard(P);
}
function refreshMain(){
  if(!S.roundId) return;
  if(S.mode==="write") refreshWrite(); else if(S.mode==="head") refreshHead(); else mountBoard($("panel"));
}

/* write */
function mountWrite(P){
  const u=U[S.unit];
  P.innerHTML=`
    <div class="phead"><div><div class="eyebrow">${u.kind==="dept"?"부서 협의":"학년 협의"} · 답변 작성</div><h2>${u.name}</h2></div>
      <div class="who">취합: ${esc(headTitle(u))}</div></div>
    ${permNote()}
    <div id="lockNote"></div>
    <form class="form" id="wForm">
      <div class="grid2">
        <label>작성자<select id="wName"><option value="">이름을 고르세요</option>${u.roster.map(([n,t],i)=>`<option value="${i}">${esc(n)} · ${esc(t)}</option>`).join("")}<option value="other">명단에 없음(직접 입력)</option></select></label>
        <label>담당 업무 / 반<input id="wTask" maxlength="40" placeholder="예: 체험학습, 6-3 담임"></label>
      </div>
      <label id="wOtherWrap" hidden>이름<input id="wOther" maxlength="20"></label>
      <div class="secform"><span class="eyebrow">협의 내용</span>
        ${SECS.map(([k,l,ph],i)=>`<label class="seclabel">${i+1}. ${l}<textarea id="w${k}" placeholder="${ph}"></textarea></label>`).join("")}</div>
      <div class="actions"><span class="muted" id="wEditing" style="margin-right:auto;font-size:.85rem"></span>
        <button type="button" class="ghost" id="wCancel" hidden>수정 취소</button>
        <button type="submit" class="primary" id="wSubmit">제출</button></div>
    </form>
    <div><h3 style="margin-bottom:8px">올라온 답변 <span class="muted" id="wCount"></span></h3><div class="posts" id="wPosts"></div></div>`;
  const saved=ls.get("hy.name."+S.unit);
  if(saved!=null&&$("wName").querySelector(`option[value="${saved}"]`)){ $("wName").value=saved; syncTask(); }
  $("wName").onchange=()=>{ls.set("hy.name."+S.unit,$("wName").value); syncTask();};
  $("wForm").addEventListener("submit",submitPost);
  $("wCancel").onclick=()=>{S.editingId=null; setW(["","",""]); $("wEditing").textContent=""; $("wCancel").hidden=true; $("wSubmit").textContent="제출";};
  $("wPosts").addEventListener("click",postOps);
  refreshWrite();
}
function syncTask(){
  const v=$("wName").value, u=U[S.unit];
  $("wOtherWrap").hidden = v!=="other";
  if(v!==""&&v!=="other") $("wTask").value=u.roster[+v][1];
}
function refreshWrite(){
  if(!$("wPosts")) return;
  const done=statusOf(S.unit)==="done", s=sumOf(S.unit);
  $("lockNote").innerHTML = done?`<div class="notice lock">${fmt(s.submittedAt)}에 완료 제출되었습니다 (취합: ${esc(headTitle(U[S.unit]))}). 추가 의견은 취합 담당자께 직접 전해 주세요.</div>`:"";
  const ro = done || S.canWrite===false || !S.db;
  ["wName","wTask","wOther","ws1","ws2","ws3","wSubmit"].forEach(id=>$(id).disabled=ro);
  const list=unitPosts(S.unit);
  $("wCount").textContent=list.length?`${list.length}건`:"";
  $("wPosts").innerHTML = list.length? list.map(p=>postHTML(p,!done)).join("") : `<div class="empty">아직 올라온 답변이 없습니다. 첫 답변을 올려 주세요.</div>`;
}
function postHTML(p,editable,extra=""){
  const mine = editable && S.uid && p.uid===S.uid;
  return `<div class="post" data-id="${esc(p.id)}"><div class="meta"><span class="nm">${esc(p.name)}</span>${p.task?`<span class="tk">${esc(p.task)}</span>`:""}<span class="tm">${fmt(p.updatedAt||p.createdAt)}${p.updatedAt&&p.updatedAt!==p.createdAt?" 수정":""}</span>
    <span class="ops">${extra}${mine?`<button class="ghost" data-op="edit">수정</button><button class="ghost" data-op="del">삭제</button>`:""}</span></div>
    ${secsHTML(p)}</div>`;
}
async function submitPost(e){
  e.preventDefault(); const u=U[S.unit]; const v=$("wName").value;
  let name = v==="other"? $("wOther").value.trim() : (v!==""? u.roster[+v][0] : "");
  const task=$("wTask").value.trim();
  const sec={s1:$("ws1").value.trim(),s2:$("ws2").value.trim(),s3:$("ws3").value.trim()};
  if(!name){toast("작성자 이름을 골라 주세요.");return;} if(!sec.s1&&!sec.s2&&!sec.s3){toast("협의 내용을 한 항목 이상 적어 주세요.");return;}
  const content=composeText(sec);
  $("wSubmit").disabled=true;
  try{
    const now=Date.now();
    if(S.editingId){ await S.db.doc("posts/"+S.editingId).update({name,task,...sec,content,updatedAt:now}); toast("답변을 고쳤습니다."); }
    else { await S.db.collection("posts").add({roundId:S.roundId,unit:S.unit,name,task,...sec,content,uid:S.uid,createdAt:now,updatedAt:now}); toast("답변을 제출했습니다."); }
    S.editingId=null; setW(["","",""]); $("wEditing").textContent=""; $("wCancel").hidden=true; $("wSubmit").textContent="제출";
  }catch(err){fail(err);}
  $("wSubmit").disabled=false;
}
async function postOps(e){
  const b=e.target.closest("[data-op]"); if(!b) return; const id=b.closest(".post").dataset.id; const p=S.posts.find(x=>x.id===id); if(!p) return;
  if(b.dataset.op==="edit"){
    S.editingId=id; setW(secVals(p)); $("wTask").value=p.task||"";
    $("wEditing").textContent=`${p.name} 님의 답변을 고치는 중`; $("wCancel").hidden=false; $("wSubmit").textContent="수정 저장"; $("ws1").focus();
  } else if(b.dataset.op==="del"){
    if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="삭제 확인"; b.style.color="var(--seal)"; setTimeout(()=>{if(b.isConnected){b.dataset.armed="";b.textContent="삭제";b.style.color="";}},3000); return; }
    try{ await S.db.doc("posts/"+id).delete(); toast("답변을 삭제했습니다."); }catch(err){fail(err);}
  }
}

/* head */
function mountHead(P){
  const u=U[S.unit];
  P.innerHTML=`
    <div class="phead"><div><div class="eyebrow">${u.kind==="dept"?"업무(기능)부장":"학년부장"} 취합</div><h2>${u.name}</h2>
      <div class="who" style="margin-top:2px">취합 담당 ${esc(headTitle(u))}</div></div><div id="hStamp"></div></div>
    ${permNote()}
    <div id="hStatus"></div>
    <div><h3 style="margin-bottom:6px">답변 <span class="muted" id="hCount"></span></h3>
      <div class="missing" id="hMissing"></div>
      <div class="posts" id="hPosts" style="margin-top:8px"></div></div>
    <div class="form">
      <div class="phead" style="align-items:center"><h3>${u.name} 협의 결과</h3><button id="hFill" type="button">답변 전체 불러오기</button></div>
      <p class="muted" style="margin:0;font-size:.85rem">‘답변 전체 불러오기’를 누르면 선생님들의 답변이 항목별로 모입니다. 초안을 다듬어 저장하세요.</p>
      ${SECS.map(([k,l],i)=>`<label class="seclabel">${i+1}. ${l}<textarea id="h${k}" class="htext" style="min-height:150px"></textarea></label>`).join("")}
      <div class="actions"><span class="muted" id="hSaved" style="margin-right:auto;font-size:.85rem"></span>
        <button type="button" id="hReopen" hidden>완료 취소</button>
        <button type="button" id="hDraft">임시 저장</button>
        <button type="button" class="seal" id="hDone">완료 제출</button></div>
    </div>`;
  const dirty=()=>{S.sumDirty=true; $("hSaved").textContent="저장 안 된 변경 있음";};
  SECS.forEach(([k])=>$("h"+k).addEventListener("input",dirty));
  const appendPosts=list=>SECS.forEach(([k],i)=>{
    const t=list.map(p=>{const v=secVals(p)[i].trim(); return v?`■ ${p.name}${p.task?` (${p.task})`:""}\n${v}`:"";}).filter(Boolean).join("\n\n");
    if(!t) return; const el=$("h"+k), cur=el.value.trim(); el.value = cur? cur+"\n\n"+t : t; });
  $("hFill").onclick=()=>{ const list=unitPosts(S.unit); if(!list.length){toast("불러올 답변이 없습니다.");return;}
    appendPosts(list); dirty(); };
  $("hPosts").addEventListener("click",e=>{const b=e.target.closest("[data-op='add']"); if(!b) return; const p=S.posts.find(x=>x.id===b.closest(".post").dataset.id); if(!p) return;
    appendPosts([p]); dirty(); toast(`${p.name} 님 답변을 항목별로 넣었습니다.`);});
  $("hDraft").onclick=()=>saveSum("draft");
  $("hDone").onclick=e=>{ const b=e.currentTarget; if(!SECS.some(([k])=>$("h"+k).value.trim())){toast("협의 결과를 먼저 작성해 주세요.");return;}
    if(b.dataset.armed!=="1"){b.dataset.armed="1"; b.textContent="정말 완료 제출"; setTimeout(()=>{if(b.isConnected){b.dataset.armed="";b.textContent="완료 제출";}},3500); return;}
    b.dataset.armed=""; saveSum("done"); };
  $("hReopen").onclick=()=>saveSum("draft",true);
  refreshHead();
}
function refreshHead(){
  if(!$("hPosts")) return;
  const u=U[S.unit], s=sumOf(S.unit), done=statusOf(S.unit)==="done", list=unitPosts(S.unit);
  $("hStamp").innerHTML = done?`<div class="stamp">완료<small>${fmt(s.submittedAt)}</small></div>`:"";
  $("hStatus").innerHTML = done?`<div class="notice lock">완료 제출되어 교육과정부로 전달되었습니다. 고치려면 ‘완료 취소’를 누르세요.</div>`:"";
  $("hCount").textContent=list.length?`${list.length}건`:"";
  const answered=new Set(list.map(p=>p.name)); const miss=u.roster.map(r=>r[0]).filter(n=>!answered.has(n));
  $("hMissing").innerHTML = miss.length? `<span class="muted" style="font-size:.8rem">아직 답변 없음</span>`+miss.map(n=>`<span class="chip">${esc(n)}</span>`).join("") : `<span class="chip" style="color:var(--ok);border-color:var(--ok)">명단 전원 답변 완료</span>`;
  $("hPosts").innerHTML = list.length? list.map(p=>postHTML(p,false, done?"":`<button class="ghost" data-op="add">결과에 넣기</button>`)).join("") : `<div class="empty">아직 올라온 답변이 없습니다.</div>`;
  if(!S.sumDirty){ const v=secVals(s); SECS.forEach(([k],i)=>$("h"+k).value=v[i]); $("hSaved").textContent = s&&s.updatedAt? `${fmt(s.updatedAt)} 저장됨`:""; }
  const ro = S.canWrite===false || !S.db;
  SECS.forEach(([k])=>$("h"+k).readOnly = done || ro); $("hFill").disabled=done||ro; $("hDraft").disabled=done||ro; $("hDone").disabled=done||ro;
  $("hDraft").hidden=done; $("hDone").hidden=done; $("hReopen").hidden=!done; $("hReopen").disabled=ro;
}
async function saveSum(status,reopen=false){
  const u=U[S.unit], prev=sumOf(S.unit)||{};
  const v = reopen? secVals(prev) : SECS.map(([k])=>$("h"+k).value.trim());
  const sec={s1:v[0],s2:v[1],s3:v[2]}, content=composeText(sec);
  const now=Date.now();
  const body={roundId:S.roundId,unit:S.unit,...sec,content,status,head:u.head,uid:S.uid,updatedAt:now,
    submittedAt: status==="done"? now : null};
  try{ await S.db.doc(`summaries/${S.roundId}__${S.unit}`).set(body); S.sumDirty=false;
    toast(status==="done"?`${u.name} 협의 결과를 완료 제출했습니다.`: reopen?"완료를 취소했습니다. 다시 고칠 수 있습니다.":"임시 저장했습니다."); refreshHead(); }
  catch(err){fail(err);}
}

/* board */
function compileText(){
  const r=curRound(); let out=`[${r?r.title:""}] 부서·학년 협의 결과\n`;
  UNITS.forEach(u=>{ const s=sumOf(u.key); out+=`\n━━ ${u.name} (${headTitle(u)}) — ${STATUS_LABEL[statusOf(u.key)]}\n`;
    out+= s&&s.status==="done"? textOf(s)+"\n" : "(완료 제출 전)\n"; });
  return out;
}
const csvCell=v=>`"${String(v??"").replace(/"/g,'""')}"`;
function mountBoard(P){
  const counts={done:0,draft:0,coll:0,wait:0}; UNITS.forEach(u=>counts[statusOf(u.key)]++);
  const cell=u=>{const st=statusOf(u.key), n=unitPosts(u.key).length, names=new Set(unitPosts(u.key).map(p=>p.name)).size;
    return `<button class="cell" data-goto="${u.key}"><span class="n">${u.name}</span><span class="h">${esc(headTitle(u))}</span>
      <span class="h" style="font-variant-numeric:tabular-nums">답변 ${n}건 · ${names}/${u.roster.length}명</span>
      ${st==="done"?`<span class="stamp sm">완료</span>`:`<span class="pill ${st}">${STATUS_LABEL[st]}</span>`}</button>`;};
  const art=u=>{const s=sumOf(u.key), st=statusOf(u.key), list=unitPosts(u.key);
    return `<article><div class="t"><h3>${u.name}</h3><span class="muted" style="font-size:.85rem">${esc(headTitle(u))}</span>
      <span class="pill ${st}" style="margin:0">${STATUS_LABEL[st]}${st==="done"?" · "+fmt(s.submittedAt):""}</span></div>
      ${st==="done"?`<div class="body">${secsHTML(s)}</div>`:`<div class="muted" style="font-size:.9rem">부장 완료 제출 전입니다.${st==="draft"?" (취합 초안 작성 중)":""}</div>`}
      ${list.length?`<details><summary>원답변 ${list.length}건 보기</summary><div class="posts">${list.map(p=>postHTML(p,false)).join("")}</div></details>`:""}</article>`;};
  P.innerHTML=`
    <div class="phead"><div><div class="eyebrow">교육과정부 종합</div><h2>${esc(curRound()?.title||"")} 취합 현황</h2></div>
      <div class="actions"><button id="bCopy">완료분 전체 복사</button><button id="bCsv">CSV 내려받기</button></div></div>
    <div class="sumline"><span><b style="color:var(--seal)">${counts.done}</b>/${UNITS.length} 완료</span><span><b>${counts.draft}</b>취합 중</span><span><b>${counts.coll}</b>답변 수집 중</span><span class="muted"><b>${counts.wait}</b>대기</span></div>
    <div><div class="eyebrow" style="margin-bottom:6px">업무(기능) 부서</div><div class="board dept">${UNITS.filter(u=>u.kind==="dept").map(cell).join("")}</div></div>
    <div><div class="eyebrow" style="margin-bottom:6px">학년</div><div class="board">${UNITS.filter(u=>u.kind==="grade").map(cell).join("")}</div></div>
    <div class="doc">${UNITS.map(art).join("")}</div>`;
  P.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{ S.unit=b.dataset.goto; ls.set("hy.unit",S.unit); document.getElementById("tab-head").click(); });
  $("bCopy").onclick=async()=>{ const t=compileText(); try{await navigator.clipboard.writeText(t); toast("복사했습니다. 한글·워드에 붙여 넣으세요.");}
    catch(e){ const ta=document.createElement("textarea"); ta.value=t; ta.style.minHeight="200px"; P.appendChild(ta); ta.select(); toast("자동 복사가 막혀 아래에 텍스트를 펼쳤습니다. Ctrl+C로 복사하세요."); } };
  $("bCsv").onclick=async()=>{
    const L=SECS.map(([,l],i)=>`${i+1}. ${l}`);
    const rows=[["구분","부서/학년","취합 부장","상태","완료 제출 시각",...L.map(x=>"[결과] "+x),"작성자","담당 업무",...L.map(x=>"[답변] "+x),"답변 시각"]];
    UNITS.forEach(u=>{ const s=sumOf(u.key), st=STATUS_LABEL[statusOf(u.key)], list=unitPosts(u.key), isDone=s&&s.status==="done";
      const base=[u.kind==="dept"?"부서":"학년",u.name,u.head,st,isDone?new Date(s.submittedAt).toLocaleString("ko-KR"):"",...(isDone?secVals(s):["","",""])];
      const blank=[base[0],base[1],"","","","","",""];
      if(!list.length) rows.push([...base,"","","","","",""]);
      list.forEach((p,i)=>rows.push([...(i===0?base:blank),p.name,p.task||"",...secVals(p),new Date(p.createdAt).toLocaleString("ko-KR")])); });
    const csv="﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
    const dl = window.claude ? await claude.use("downloads") : null;
    if(!dl){toast("이 화면에서는 내려받기를 쓸 수 없습니다. ‘전체 복사’를 이용해 주세요.");return;}
    try{ await dl.save({filename:`협의취합_${(curRound()?.title||"회차").replace(/[\\/:*?"<>|]/g,"")}.csv`,data:csv}); toast("CSV 파일을 저장했습니다."); }
    catch(e){ if(e&&e.code!=="declined") toast("내려받기를 하지 못했습니다."); }
  };
}

/* ---------- enable storage ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-enable-db]"); if(!b) return;
  const msg=$("enableMsg"); const say=t=>{ if(msg) msg.textContent=t; else toast(t); };
  const perms = window.claude&&claude.use ? await claude.use("permissions") : null;
  if(!perms){ say("이 화면에서는 저장 기능을 쓸 수 없습니다. claude.ai 웹에서 로그인한 뒤 이 링크를 열어 주세요."); return; }
  b.disabled=true;
  let st=await perms.state("db");
  if(st==="prompt"){ const r=await perms.request(["db","user","downloads"]); st=r.db; }
  else if(st==="denied"){ try{ await perms.manage(); }catch(err){ say("오른쪽 위 메뉴의 ‘권한(Permissions)’에서 저장 기능을 켜 주세요."); b.disabled=false; return; } st=await perms.state("db"); }
  if(st==="granted"){ say("저장 기능을 켰습니다. 페이지를 다시 불러옵니다."); setTimeout(()=>location.reload(),600); }
  else if(st==="unavailable"){ say("이 화면에서는 저장 기능을 쓸 수 없습니다. claude.ai 웹에서 로그인한 뒤 이 링크를 열어 주세요."); }
  else { say("아직 허용되지 않았습니다. 오른쪽 위 메뉴의 ‘권한(Permissions)’에서 저장 기능을 켜 주세요."); b.disabled=false; }
});

/* ---------- boot ---------- */
(async function boot(){
  S.mode = ["write","head","board"].includes(ls.get("hy.mode"))? ls.get("hy.mode") : "write";
  S.unit = U[ls.get("hy.unit")]? ls.get("hy.unit") : "gyomu";
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.mode===S.mode));
  renderUnits();
  const use = window.claude && claude.use ? claude.use.bind(claude) : null;
  if(use){ try{ const perms=await use("permissions");
    if(perms){ const st=await perms.state(); if(["db","user","downloads"].some(k=>st[k]==="prompt")) await perms.request(["db","user","downloads"]); }
  }catch(e){} }
  const [db,user] = use? await Promise.all([use("db"),use("user")]) : [null,null];
  S.db=db; S.user=user;
  if(user){ S.uid=await user.id(); S.isAdmin=await user.canEdit(); S.canWrite=await user.can("data.write"); }
  S.loaded=true;
  if(!db){ renderRounds(); $("panel").innerHTML=permNote()+`<div class="empty">저장 기능을 켜면 협의 회차와 답변이 이곳에 표시됩니다.</div>`; return; }
  let first=true;
  db.collection("rounds").onSnapshot(snap=>{
    S.rounds=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    if(first||!S.rounds.find(r=>r.id===S.roundId)){
      first=false; const saved=ls.get("hy.round");
      const pick = S.rounds.find(r=>r.id===saved)? saved : (S.rounds[0]?.id||null);
      S.roundId===pick && S.unsub.length ? renderRounds() : (S.roundId=null, selectRound(pick));
    } else { renderRounds(); }
  },()=>{ $("panel").innerHTML=`<div class="empty">자료를 불러오지 못했습니다. 페이지를 새로 고쳐 주세요.</div>`; });
})();
</script>
